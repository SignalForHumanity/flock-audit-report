[package]
name = "flock-audit-report"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Summarize Flock ALPR search-audit CSVs from public-records requests, privately in the browser"
repository = "https://github.com/SignalForHumanity/flock-audit-report"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = 3
lto = true
